<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Türkiye liglerinde geçen mobil öncelikli kulüp başkanlığı oyunu."
    />
    <title>Kulüp Başkanı</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="club-picker" class="onboarding" aria-labelledby="picker-title">
        <div class="brand-mark" aria-hidden="true">KB</div>
        <p class="eyebrow">YENİ KARİYER</p>
        <h1 id="picker-title">Kulübünü seç</h1>
        <p class="muted intro-copy">
          Kadronu yönet, maçları simüle et ve transferlerle zirveye çık.
        </p>

        <label class="search-field">
          <span class="sr-only">Kulüp ara</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.35-4.35m2.35-5.4a7.75 7.75 0 1 1-15.5 0 7.75 7.75 0 0 1 15.5 0Z" />
          </svg>
          <input id="club-search" type="search" placeholder="Kulüp ara" autocomplete="off" />
        </label>

        <div id="club-list" class="club-list" role="list"></div>
        <p class="demo-note">İlk sürüm kurgusal demo verileri kullanır.</p>
      </section>

      <main id="game" class="game" hidden>
        <header class="topbar">
          <button id="club-identity" class="club-identity" type="button" aria-label="Kulüp bilgileri"></button>
          <div class="budget-block">
            <span>KASA</span>
            <strong id="budget-value">€0</strong>
          </div>
        </header>

        <div id="view" class="view" tabindex="-1"></div>

        <nav class="bottom-nav" aria-label="Ana menü">
          <button class="nav-item is-active" type="button" data-route="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8V21h-6v-6H9v6H3V10.8Z" /></svg>
            <span>Ana</span>
          </button>
          <button class="nav-item" type="button" data-route="squad">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
            <span>Kadro</span>
          </button>
          <button class="nav-item" type="button" data-route="transfer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4m14 4H3" /></svg>
            <span>Transfer</span>
          </button>
          <button class="nav-item" type="button" data-route="league">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4H4v2a5 5 0 0 0 5 5m8-7h3v2a5 5 0 0 1-5 5M7 3h10v5a5 5 0 0 1-10 0V3Z" /></svg>
            <span>Lig</span>
          </button>
          <button class="nav-item" type="button" data-route="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
            <span>Menü</span>
          </button>
        </nav>
      </main>
    </div>

    <dialog id="player-dialog" class="player-dialog">
      <div id="player-dialog-content"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
